<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="NumberGuessingGame.css">
</head>
<body>
    <div class="gamediv"><input type="text" name="guessGame" id="guessGame" disabled>
    <h3>Chances Left: <span>5</span></h3>
    <table>
        <tr>
            <td><button class="btn">7</button></td>
            <td><button class="btn">8</button></td>
            <td><button class="btn">9</button></td>
        </tr>
        <tr>
            <td><button class="btn">4</button></td>
            <td><button class="btn">5</button></td>
            <td><button class="btn">6</button></td>
        </tr>
        <tr>
            <td><button class="btn">1</button></td>
            <td><button class="btn">2</button></td>
            <td><button class="btn">3</button></td>
        </tr>
    </table>
    <div class="functionbtn">  
    <button>Start</button>
    <button>Pause</button>
    <button>Stop</button>
    </div>

</div> 
</body>
</html>
