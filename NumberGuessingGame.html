<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="NumberGuessingGame.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.4/confetti.js" integrity="sha512-C1P1Tk/O5Ex5drtP+pwLarHdzrkZgCIFmTpqDMP9Zft2gfeafYEQjgVO7h7726MrbK8/dt0qPrt6p+mbzJoXHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="NumberGuessingGame.js" defer></script>
</head>

<body>
    <div class="gamediv"><input type="text" name="guessGame" id="guessGame" disabled>
    <h3>Chances Left: <span>5</span></h3>
    <table>
        <tr>
            <td><button class="btn">7</button></td>
            <td><button class="btn">8</button></td>
            <td><button class="btn">9</button></td>
        </tr>
        <tr>
            <td><button class="btn">4</button></td>
            <td><button class="btn">5</button></td>
            <td><button class="btn">6</button></td>
        </tr>
        <tr>
            <td><button class="btn">1</button></td>
            <td><button class="btn">2</button></td>
            <td><button class="btn">3</button></td>
        </tr>
    </table>
    <div class="functionbtn">  
    <button>Start</button>
    <button>Pause</button>
    <button>Stop</button>
    </div>

</div> 
</body>


</html>
